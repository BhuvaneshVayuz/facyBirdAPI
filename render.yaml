# Render blueprint. Dashboard -> New -> Blueprint -> point at this repo.
#
# DATABASE_URL is NOT set here, for the same reason it isn't in
# leaderboard-api's blueprint: Postgres lives on Neon, not Render, so the
# connection string gets pasted in by hand under this service's Environment
# tab. Point it at the *same* Neon database leaderboard-api uses -- this
# service creates its own `face_cutouts` table there and touches nothing
# else. Leaving it unset is a supported configuration, not a broken one:
# the cutout cache disables itself and every request recomputes.
services:
  - type: web
    name: facy-bird-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_BYTES
        value: "8388608"
      - key: OUTPUT_SIZE
        value: "512"
